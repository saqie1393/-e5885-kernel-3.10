name: Build AmneziaWG for E5885 (Linaro GCC 4.7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Extract and setup Linaro GCC 4.7
      run: |
        echo "=== Checking gcc folder ==="
        ls -la gcc/
        
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        
        echo "/opt/gcc-4.7/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_ENV
        
        /opt/gcc-4.7/bin/arm-linux-gnueabihf-gcc --version
        
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          bc
    
    - name: Detect kernel directory
      run: |
        # Root Makefile check karein (aapke repo mein kernel root mein hai)
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
          echo "=== Using root directory as kernel ==="
        elif [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
          KERNEL_DIR="kernel"
          echo "=== Using kernel/ folder ==="
        elif [ -f kernel/e5885-kernel-3.10/Makefile ] && grep -q "mrproper" kernel/e5885-kernel-3.10/Makefile; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
          echo "=== Using kernel/e5885-kernel-3.10/ folder ==="
        else
          echo "=== Kernel Makefile not found! ==="
          ls -la
          exit 1
        fi
        
        echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
        
        # Kernel version confirm karein
        cd "$KERNEL_DIR"
        head -5 Makefile
    
    - name: Setup kernel build
      run: |
        cd "$KERNEL_DIR"
        
        export PATH=/opt/gcc-4.7/bin:$PATH
        
        # E5885 ka exact defconfig use karein
        if [ -f arch/arm/configs/hi6932_E5885Ls-93a_defconfig ]; then
          echo "=== Using hi6932_E5885Ls-93a_defconfig ==="
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- hi6932_E5885Ls-93a_defconfig
        else
          echo "=== E5885 defconfig not found! Available configs: ==="
          ls arch/arm/configs/
          exit 1
        fi
        
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare
    
    - name: Clone AmneziaWG kernel module
      run: |
        cd "$KERNEL_DIR"
        
        # SAHI repository - yeh kernel module hai, Go program nahi
        git clone https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git ../amneziawg-kmod
        
        # Kernel module source ko drivers/net mein link karein
        ln -sf ../amneziawg-kmod/src ./drivers/net/amneziawg
        
        echo "=== AmneziaWG source structure ==="
        ls -la ../amneziawg-kmod/
        ls -la ../amneziawg-kmod/src/ | head -20
    
    - name: Build AmneziaWG module
      run: |
        cd "$KERNEL_DIR"
        
        export PATH=/opt/gcc-4.7/bin:$PATH
        
        # AmneziaWG ka build system src/ folder ke andar hai
        make -C . \
          M=drivers/net/amneziawg \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          CC=arm-linux-gnueabihf-gcc \
          V=1 \
          modules 2>&1 | tee /tmp/build.log
        
        echo "=== Build log saved to /tmp/build.log ==="
    
    - name: Strip and verify module
      run: |
        cd "$KERNEL_DIR"
        
        export PATH=/opt/gcc-4.7/bin:$PATH
        
        # Module dhundein - AmneziaWG build system alag jagah output kar sakta hai
        MODULE_PATH=$(find . -name "amneziawg.ko" -type f 2>/dev/null | head -1)
        
        if [ -n "$MODULE_PATH" ]; then
          echo "Found module at: $MODULE_PATH"
          cp "$MODULE_PATH" ./amneziawg.ko
          
          arm-linux-gnueabihf-strip --strip-unneeded amneziawg.ko
          
          echo "=== Module Information ==="
          file amneziawg.ko
          modinfo amneziawg.ko || true
          
          echo "=== Vermagic (critical for loading) ==="
          modinfo amneziawg.ko | grep vermagic || echo "WARNING: Vermagic not found"
        else
          echo "=== Module not found! Searching all .ko files ==="
          find . -name "*.ko" -type f
          echo "=== Build log tail ==="
          tail -100 /tmp/build.log
          exit 1
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-e5885-gcc47
        path: kernel/amneziawg.ko
        if-no-files-found: error
