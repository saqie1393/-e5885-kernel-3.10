- name: Install GCC 4.7 from local .deb file
  run: |
    # Check ke file exist karti hai
    echo "=== Checking tools folder ==="
    ls -la tools/
    
    # .deb file install karein (exact filename - NO .deb extension)
    sudo dpkg -i "tools/gcc-4.7-arm-linux-gnueabi_4.7.4-3ubuntu12cross3_amd64.deb " || true
    
    # Fix missing dependencies
    sudo apt-get install -f -y
    
    # Install other required packages
    sudo apt-get install -y \
      binutils-arm-linux-gnueabi \
      build-essential \
      libncurses-dev \
      bison \
      flex \
      libssl-dev \
      bc
    
    # Check installed GCC files
    echo "=== Searching for GCC 4.7 ==="
    find /usr -name "*gcc-4.7*" 2>/dev/null || true
    
    # GCC 4.7 ko default banayein
    if [ -f /usr/bin/arm-linux-gnueabi-gcc-4.7 ]; then
      sudo update-alternatives --install /usr/bin/arm-linux-gnueabi-gcc arm-linux-gnueabi-gcc /usr/bin/arm-linux-gnueabi-gcc-4.7 100
      sudo update-alternatives --set arm-linux-gnueabi-gcc /usr/bin/arm-linux-gnueabi-gcc-4.7
      echo "=== Using GCC 4.7 ==="
      arm-linux-gnueabi-gcc --version
      export CC=arm-linux-gnueabi-gcc
      export CROSS_COMPILE=arm-linux-gnueabi-
    else
      echo "=== GCC 4.7 not found, using default GCC ==="
      sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
      export CC=arm-linux-gnueabi-gcc
      export CROSS_COMPILE=arm-linux-gnueabi-
    fi
