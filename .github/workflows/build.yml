name: Build AmneziaWG for E5885 (Linaro GCC 4.7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Extract and setup Linaro GCC 4.7
      run: |
        echo "=== Checking gcc folder ==="
        ls -la gcc/
        
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        
        echo "/opt/gcc-4.7/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_ENV
        
        /opt/gcc-4.7/bin/arm-linux-gnueabihf-gcc --version
        
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          bc
    
    - name: Debug - Check kernel folder structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== List all files in root ==="
        ls -la
        echo "=== Check kernel folder ==="
        ls -la kernel/ || echo "kernel folder not found"
        echo "=== Check if Makefile exists ==="
        find . -name "Makefile" -type f | head -10
    
    - name: Setup kernel build
      run: |
        # Pehle check karein ke kaunsa folder sahi hai
        if [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
          echo "=== Using kernel/ folder ==="
          cd kernel
        elif [ -f kernel/e5885-kernel-3.10/Makefile ] && grep -q "mrproper" kernel/e5885-kernel-3.10/Makefile; then
          echo "=== Using kernel/e5885-kernel-3.10/ folder ==="
          cd kernel/e5885-kernel-3.10
        else
          echo "=== Makefile with mrproper not found! ==="
          echo "Searching for mrproper in all Makefiles..."
          grep -r "mrproper" . --include="Makefile" 2>/dev/null || echo "mrproper not found"
          exit 1
        fi
        
        export PATH=/opt/gcc-4.7/bin:$PATH
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- mrproper
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare
        
    - name: Download AmneziaWG source
      run: |
        # Same folder detection
        if [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
          cd kernel
        elif [ -f kernel/e5885-kernel-3.10/Makefile ] && grep -q "mrproper" kernel/e5885-kernel-3.10/Makefile; then
          cd kernel/e5885-kernel-3.10
        else
          exit 1
        fi
        
        git clone --branch v2.0 https://github.com/amnezia-vpn/amneziawg-go.git ../amneziawg
        ln -s ../amneziawg ./drivers/net/amneziawg
        cd drivers/net/amneziawg
        sed -i 's/CONFIG_ZINC_ARCH_ARM=y/CONFIG_ZINC_ARCH_ARM=n/g' Makefile 2>/dev/null || true
        
    - name: Build AmneziaWG module
      run: |
        if [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
          cd kernel
        elif [ -f kernel/e5885-kernel-3.10/Makefile ] && grep -q "mrproper" kernel/e5885-kernel-3.10/Makefile; then
          cd kernel/e5885-kernel-3.10
        else
          exit 1
        fi
        
        export PATH=/opt/gcc-4.7/bin:$PATH
        make -C . \
          M=drivers/net/amneziawg \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          CC=arm-linux-gnueabihf-gcc \
          CONFIG_ZINC_ARCH_ARM=n \
          V=1 \
          modules
    
    - name: Strip and verify module
      run: |
        if [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
          cd kernel
        elif [ -f kernel/e5885-kernel-3.10/Makefile ] && grep -q "mrproper" kernel/e5885-kernel-3.10/Makefile; then
          cd kernel/e5885-kernel-3.10
        else
          exit 1
        fi
        
        export PATH=/opt/gcc-4.7/bin:$PATH
        if [ -f drivers/net/amneziawg/amneziawg.ko ]; then
          cp drivers/net/amneziawg/amneziawg.ko ./
          arm-linux-gnueabihf-strip --strip-unneeded amneziawg.ko
          
          echo "=== Module Information ==="
          file amneziawg.ko
          modinfo amneziawg.ko || true
          
          echo "=== Vermagic ==="
          modinfo amneziawg.ko | grep vermagic || echo "Vermagic not found"
        else
          echo "Module not found! Checking build directory..."
          find drivers -name "*.ko" -type f
          exit 1
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-e5885-linaro-gcc47
        path: kernel/amneziawg.ko
