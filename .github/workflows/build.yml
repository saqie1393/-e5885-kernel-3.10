name: Build AmneziaWG v1.0.20260725 - E5885

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          bc \
          git \
          file

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        set -e

        echo "=== GCC Archive ==="
        ls -lh gcc/

        tar -xjf \
          gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 \
          -C /opt/

        sudo mv \
          /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux \
          /opt/gcc-4.7

        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

        export PATH=/opt/gcc-4.7/bin:$PATH

        arm-linux-gnueabihf-gcc --version
        arm-linux-gnueabihf-strip --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        set -e

        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"
          ls -la
          exit 1
        fi

        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

        echo "=== Kernel Directory ==="
        echo "$KERNEL_DIR"

    - name: Configure E5885 Kernel
      shell: bash
      run: |
        set -e

        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"

        make ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          HOSTCFLAGS=-fcommon \
          hi6932_E5885Ls-93a_defconfig

        echo "=== Kernel Prepare ==="

        make ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          HOSTCFLAGS=-fcommon \
          prepare

        make ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          HOSTCFLAGS=-fcommon \
          modules_prepare

        test -f include/generated/autoconf.h
        test -f include/config/auto.conf

    - name: Clone AmneziaWG v1.0.20260725
      shell: bash
      run: |
        set -e

        cd "$KERNEL_DIR"

        git clone \
          --branch v1.0.20260725 \
          --depth 1 \
          https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git \
          ../amneziawg-kmod

        rm -rf drivers/net/amneziawg

        ln -s "$(realpath ../amneziawg-kmod/src)" \
          drivers/net/amneziawg

        echo "=== AmneziaWG Version ==="
        git -C ../amneziawg-kmod describe --tags

        echo "=== Module Makefile ==="
        ls -l drivers/net/amneziawg/Makefile

    - name: Fix ARM CPUID compatibility
      shell: bash
      run: |
        set -e
        COMPAT="$KERNEL_DIR/drivers/net/amneziawg/compat/compat.h"

        sed -i '/#define read_cpuid_part() read_cpuid_part_number()/d' "$COMPAT"

        grep -n "read_cpuid_part" "$COMPAT" || true

    - name: Fix fallthrough for Linux 3.10
      shell: bash
      run: |
        set -e
        COMPAT="$KERNEL_DIR/drivers/net/amneziawg/compat/compat.h"

        cat >> "$COMPAT" <<'EOF'

        /* Linux 3.10 compatibility */
        #ifndef fallthrough
        #define fallthrough /* fall through */
        #endif
        EOF

        tail -n 8 "$COMPAT"

    - name: Build AmneziaWG
      shell: bash
      run: |
        set -e
        set -o pipefail

        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"

        echo "=== GCC ==="
        arm-linux-gnueabihf-gcc --version

        echo "=== Building AmneziaWG ==="

        make -C . \
          M=drivers/net/amneziawg \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          HOSTCFLAGS=-fcommon \
          CC=arm-linux-gnueabihf-gcc \
          V=1 \
          modules 2>&1 | tee /tmp/build.log

    - name: Strip and Verify Module
      shell: bash
      run: |
        set -e
        set -o pipefail

        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"

        echo "=== Searching for amneziawg.ko (following symlinks) ==="

        # -L flag symlink follow karta hai — yeh sabse important fix hai
        MODULE_PATH=$(find -L drivers/net/amneziawg -name "amneziawg.ko" -type f 2>/dev/null | head -1)

        # Fallback 1: symlink ke through seedha path
        if [ -z "$MODULE_PATH" ] && [ -f "drivers/net/amneziawg/amneziawg.ko" ]; then
          MODULE_PATH="drivers/net/amneziawg/amneziawg.ko"
        fi

        # Fallback 2: poore kernel tree mein dhoondo
        if [ -z "$MODULE_PATH" ]; then
          MODULE_PATH=$(find -L . -name "amneziawg.ko" -type f 2>/dev/null | head -1)
        fi

        # Fallback 3: realpath se symlink resolve karke dhoondo
        if [ -z "$MODULE_PATH" ]; then
          REAL_PATH=$(realpath drivers/net/amneziawg 2>/dev/null || true)
          if [ -n "$REAL_PATH" ] && [ -f "$REAL_PATH/amneziawg.ko" ]; then
            MODULE_PATH="$REAL_PATH/amneziawg.ko"
          fi
        fi

        if [ -z "$MODULE_PATH" ]; then
          echo "=== ERROR: amneziawg.ko not found anywhere ==="
          echo "=== Listing all .ko files in kernel tree ==="
          find -L . -name "*.ko" -type f 2>/dev/null || true
          echo "=== Last 150 lines of build log ==="
          tail -150 /tmp/build.log || true
          echo "=== Contents of drivers/net/amneziawg ==="
          ls -la drivers/net/amneziawg/ 2>/dev/null || true
          exit 1
        fi

        echo "=== Module Found ==="
        echo "Path: $MODULE_PATH"
        ls -lh "$MODULE_PATH"

        cp "$MODULE_PATH" "$GITHUB_WORKSPACE/amneziawg.ko"

        arm-linux-gnueabihf-strip --strip-unneeded "$GITHUB_WORKSPACE/amneziawg.ko"

        echo "=== File Type ==="
        file "$GITHUB_WORKSPACE/amneziawg.ko"

        echo "=== Module Vermagic ==="
        modinfo "$GITHUB_WORKSPACE/amneziawg.ko" 2>/dev/null | grep vermagic || echo "modinfo failed (host tool mismatch), skipping"

        echo "=== Module Size ==="
        ls -lh "$GITHUB_WORKSPACE/amneziawg.ko"

        echo "=== SUCCESS: amneziawg.ko is ready ==="

    - name: Upload AmneziaWG Module
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-E5885-v1.0.20260725
        path: amneziawg.ko
        if-no-files-found: error

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: E5885-AmneziaWG-Build-Log
        path: /tmp/build.log
        if-no-files-found: ignore
