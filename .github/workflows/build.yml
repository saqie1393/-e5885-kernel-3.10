name: Build and Release AmneziaWG for E5885

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Configure E5885 Kernel
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5885Ls-93a_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Clone AmneziaWG v1.0.20260725
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        git clone --branch v1.0.20260725 --depth 1 https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git ../amneziawg-kmod
        rm -rf drivers/net/amneziawg
        ln -s "$(realpath ../amneziawg-kmod/src)" drivers/net/amneziawg

    - name: Apply compatibility and warning fixes
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        AWG_SRC="drivers/net/amneziawg"

        echo "=== 1. Fix ARM CPUID ==="
        sed -i '/#define read_cpuid_part() read_cpuid_part_number()/d' "$AWG_SRC/compat/compat.h"

        echo "=== 2. Fix fallthrough ==="
        printf '\n#ifndef fallthrough\n#define fallthrough\n#endif\n' >> "$AWG_SRC/compat/compat.h"

        echo "=== 3. Fix netlink_ext_ack ==="
        sed -i '1s/^/#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)\nstruct netlink_ext_ack;\n#endif\n/' "$AWG_SRC/device.c"

        echo "=== 4. Fix dev_get_tstats64 ==="
        sed -i 's|#define dev_get_tstats64 ip_tunnel_get_stats64|#define dev_get_tstats64 dev_get_stats|g' "$AWG_SRC/compat/compat.h"

        echo "=== 5. Fix lspush/lspull ==="
        printf '#ifdef lspush\n#undef lspush\n#endif\n#ifdef lspull\n#undef lspull\n#endif\n' | cat - "$AWG_SRC/compat/compat-asm.h" > /tmp/compat-asm.tmp
        mv /tmp/compat-asm.tmp "$AWG_SRC/compat/compat-asm.h"

        echo "=== 6. Fix blake2s selftest ==="
        BLAKE2S_SELFTEST="$AWG_SRC/crypto/zinc/selftest/blake2s.c"
        if [ -f "$BLAKE2S_SELFTEST" ]; then
          sed -i '1s/^/#ifdef blake2s\n#undef blake2s\n#endif\n/' "$BLAKE2S_SELFTEST"
          echo "blake2s selftest patched"
        else
          echo "WARNING: blake2s.c not found, skipping"
        fi

        echo "=== 7. Fix ip6_dst_lookup_flow (recursion-free wrapper) ==="
        printf '%s\n' \
          '' \
          '/* Kernel 3.10 compat: ip6_dst_lookup_flow(sk, fl6, final_dst) */' \
          '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 3, 0) && !defined(ISRHEL7)' \
          'static inline struct dst_entry *__compat_ip6_dst_lookup_flow(' \
          '    struct net *net, struct sock *sk, struct flowi6 *fl6,' \
          '    const struct in6_addr *final_dst)' \
          '{' \
          '    return ip6_dst_lookup_flow(sk, fl6, final_dst);' \
          '}' \
          '#define ip6_dst_lookup_flow __compat_ip6_dst_lookup_flow' \
          '#endif' >> "$AWG_SRC/compat/compat.h"

        echo "=== All fixes applied ==="

    - name: Copy ip_tunnel files and update Kbuild
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        AWG_SRC="drivers/net/amneziawg"
        CUSTOM_DIR="kernel/drivers/net/ip_tunnel"
        cp "$CUSTOM_DIR/ip_tunnel.c" "$AWG_SRC/ip_tunnel.c"
        cp "$CUSTOM_DIR/ip_tunnels.h" "$AWG_SRC/ip_tunnels.h"
        sed -i '/EXPORT_SYMBOL_GPL/d' "$AWG_SRC/ip_tunnel.c"
        sed -i 's|^amneziawg-y := \(.*\)|amneziawg-y := \1 ip_tunnel.o|' "$AWG_SRC/Kbuild"

    - name: Build AmneziaWG
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make -C . M=drivers/net/amneziawg ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc V=1 modules 2>&1 | tee /tmp/build.log

    - name: Strip and Verify Module
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        MODULE_PATH=$(find -L drivers/net/amneziawg -name "amneziawg.ko" -type f 2>/dev/null | head -1)
        if [ -z "$MODULE_PATH" ]; then
          echo "Module not found!"
          exit 1
        fi
        cp "$MODULE_PATH" "$GITHUB_WORKSPACE/amneziawg.ko"
        arm-linux-gnueabihf-strip --strip-unneeded "$GITHUB_WORKSPACE/amneziawg.ko"
        file "$GITHUB_WORKSPACE/amneziawg.ko"
        modinfo "$GITHUB_WORKSPACE/amneziawg.ko" 2>/dev/null | grep vermagic || true

    - name: Upload Artifact (Temporary)
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-E5885-${{ github.event.inputs.version }}
        path: amneziawg.ko
        if-no-files-found: error

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: AmneziaWG E5885 ${{ github.event.inputs.version }}
        body: |
          Automated build of AmneziaWG Kernel Module for Huawei E5885.
          Version: ${{ github.event.inputs.version }}
        files: amneziawg.ko
        draft: false
        prerelease: false
