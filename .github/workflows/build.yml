
name: Build AmneziaWG for E5885 (Linaro GCC 4.7)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install dependencies and GCC 4.7
      # ==========================================
      - name: Extract and setup Linaro GCC 4.7
        run: |
          set -e

          echo "=== Checking GCC archive ==="
          ls -lh gcc/

          tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/

          mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7

          echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

          arm-linux-gnueabihf-gcc --version

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            python3 \
            git \
            cpio \
            rsync

      # ==========================================
      # 3. Detect kernel source
      # ==========================================
      - name: Detect kernel directory
        shell: bash
        run: |
          set -e

          if [ -f Makefile ] && grep -q "mrproper" Makefile; then
            KERNEL_DIR="."
          elif [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
            KERNEL_DIR="kernel"
          elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
            KERNEL_DIR="kernel/e5885-kernel-3.10"
          else
            echo "Kernel Makefile not found!"
            ls -la
            exit 1
          fi

          KERNEL_DIR="$(realpath "$KERNEL_DIR")"

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

          echo "=== Kernel directory ==="
          echo "$KERNEL_DIR"

          head -5 "$KERNEL_DIR/Makefile"

      # ==========================================
      # 4. Kernel configuration
      # ==========================================
      - name: Setup E5885 kernel
        run: |
          set -e

          cd "$KERNEL_DIR"

          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-

          echo "=== Using hi6932_E5885Ls-93a_defconfig ==="

          make \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS=-fcommon \
            hi6932_E5885Ls-93a_defconfig

          echo "=== Kernel configuration ==="

          grep CONFIG_LOCALVERSION .config || true

      # ==========================================
      # 5. Prepare kernel
      # ==========================================
      - name: Prepare kernel headers
        run: |
          set -e

          cd "$KERNEL_DIR"

          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-

          make \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS=-fcommon \
            modules_prepare

      # ==========================================
      # 6. Clone AmneziaWG
      # ==========================================
      - name: Clone AmneziaWG kernel module
        run: |
          set -e

          cd "$KERNEL_DIR"

          git clone \
            https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git \
            ../amneziawg-kmod

          ln -sfn \
            ../amneziawg-kmod/src \
            drivers/net/amneziawg

          echo "=== AmneziaWG source ==="

          ls -la ../amneziawg-kmod/
          ls -la ../amneziawg-kmod/src/

      # ==========================================
      # 7. Build AmneziaWG module
      # ==========================================
      - name: Build AmneziaWG module
        shell: bash
        run: |
          set -o pipefail

          cd "$KERNEL_DIR"

          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-

          echo "=== Building amneziawg.ko ==="

          make -C . \
            M=drivers/net/amneziawg \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS=-fcommon \
            CC=arm-linux-gnueabihf-gcc \
            V=1 \
            modules 2>&1 | tee /tmp/build.log

      # ==========================================
      # 8. Find and verify module
      # ==========================================
      - name: Strip and verify module
        run: |
          set -e

          cd "$KERNEL_DIR"

          MODULE_PATH="$(find . -name amneziawg.ko -type f | head -1)"

          if [ -z "$MODULE_PATH" ]; then
            echo "ERROR: amneziawg.ko not found!"
            echo "=== Available modules ==="
            find . -name "*.ko" -type f || true
            echo "=== Build log ==="
            tail -100 /tmp/build.log
            exit 1
          fi

          echo "=== Module found ==="
          echo "$MODULE_PATH"

          cp "$MODULE_PATH" "$GITHUB_WORKSPACE/amneziawg.ko"

          arm-linux-gnueabihf-strip \
            --strip-unneeded \
            "$GITHUB_WORKSPACE/amneziawg.ko"

          echo "=== Module file ==="
          file "$GITHUB_WORKSPACE/amneziawg.ko"

          echo "=== Module vermagic ==="
          modinfo "$GITHUB_WORKSPACE/amneziawg.ko" | grep vermagic

          echo "=== Module size ==="
          ls -lh "$GITHUB_WORKSPACE/amneziawg.ko"

      # ==========================================
      # 9. Upload artifact
      # ==========================================
      - name: Upload AmneziaWG module
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-e5885-gcc47
          path: amneziawg.ko
          if-no-files-found: error

      # ==========================================
      # 10. Upload build log on failure
      # ==========================================
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e5885-build-error-log
          path: /tmp/build.log
          if-no-files-found: ignore
