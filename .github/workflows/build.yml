
name: E5885 AmneziaWG ARMv7 Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amneziawg.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      KERNEL_DIR: .
      MODULE_DIR: drivers/net/amneziawg

    steps:
      # --------------------------------------------------
      # 1. Checkout kernel source
      # --------------------------------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------
      # 2. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            device-tree-compiler \
            python3 \
            perl \
            cpio \
            rsync \
            xz-utils \
            git \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf

      # --------------------------------------------------
      # 3. Detect kernel directory
      # --------------------------------------------------
      - name: Detect kernel directory
        shell: bash
        run: |
          set -e

          if [ -f Makefile ] && [ -f Kconfig ]; then
              KERNEL_DIR="$PWD"
          elif [ -f kernel/Makefile ] && [ -f kernel/Kconfig ]; then
              KERNEL_DIR="$PWD/kernel"
          else
              echo "ERROR: Kernel source not found"
              exit 1
          fi

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "Kernel: $KERNEL_DIR"

      # --------------------------------------------------
      # 4. Setup Linaro GCC 4.7 if archive is available
      # --------------------------------------------------
      - name: Setup Linaro GCC
        shell: bash
        run: |
          set -e

          ARCHIVE=$(find "$PWD" -maxdepth 3 -type f \
            \( -name '*gcc*4.7*.tar.xz' \
            -o -name '*gcc*4.7*.tar.bz2' \
            -o -name '*gcc*4.7*.tar.gz' \) \
            | head -n 1 || true)

          if [ -n "$ARCHIVE" ]; then
              echo "Using: $ARCHIVE"

              sudo mkdir -p /opt/gcc-4.7
              sudo tar -xf "$ARCHIVE" \
                -C /opt/gcc-4.7 \
                --strip-components=1

              echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
              echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

              /opt/gcc-4.7/bin/arm-linux-gnueabihf-gcc --version
          else
              echo "Linaro GCC 4.7 archive not found."
              echo "Using Ubuntu ARM cross compiler."

              arm-linux-gnueabihf-gcc --version
          fi

      # --------------------------------------------------
      # 5. Configure kernel
      # --------------------------------------------------
      - name: Configure E5885 kernel
        shell: bash
        run: |
          set -e
          cd "$KERNEL_DIR"

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            hi6932_E5885Ls-93a_defconfig

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            prepare

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            modules_prepare

      # --------------------------------------------------
      # 6. Clone AmneziaWG source
      # --------------------------------------------------
      - name: Download AmneziaWG
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v1.0.20260725 \
            https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git \
            "$RUNNER_TEMP/amneziawg"

          rm -rf "$KERNEL_DIR/$MODULE_DIR"

          mkdir -p "$KERNEL_DIR/drivers/net"

          ln -s "$RUNNER_TEMP/amneziawg/src" \
            "$KERNEL_DIR/$MODULE_DIR"

          ls -la "$KERNEL_DIR/$MODULE_DIR"

      # --------------------------------------------------
      # 7. CPUID compatibility
      # --------------------------------------------------
      - name: Fix ARM CPUID compatibility
        shell: bash
        run: |
          set -e

          COMPAT="$KERNEL_DIR/$MODULE_DIR/compat/compat.h"

          sed -i \
            '/#define read_cpuid_part() read_cpuid_part_number()/d' \
            "$COMPAT"

          grep -n read_cpuid_part "$COMPAT" || true

      # --------------------------------------------------
      # 8. Linux 3.10 fallthrough compatibility
      # --------------------------------------------------
      - name: Fix fallthrough compatibility
        shell: bash
        run: |
          set -e

          COMPAT="$KERNEL_DIR/$MODULE_DIR/compat/compat.h"

          if ! grep -q '#define fallthrough' "$COMPAT"; then
              cat >> "$COMPAT" <<'EOF'

          /* Linux 3.10 compatibility */
          #ifndef fallthrough
          #define fallthrough /* fall through */
          #endif
          EOF
          fi

          tail -n 10 "$COMPAT"

      # --------------------------------------------------
      # 9. ARM assembler compatibility
      # --------------------------------------------------
      - name: Fix ARM assembler macros
        shell: bash
        run: |
          set -e

          COMPAT_ASM="$KERNEL_DIR/$MODULE_DIR/compat/compat-asm.h"

          if grep -q 'lspush' "$COMPAT_ASM"; then
              sed -i \
                's/^#define lspush/#ifndef lspush\n#define lspush/' \
                "$COMPAT_ASM"

              sed -i \
                's/^#define lspull/#ifndef lspull\n#define lspull/' \
                "$COMPAT_ASM"

              sed -i \
                '/#define lspush.*$/a #endif' \
                "$COMPAT_ASM"

              sed -i \
                '/#define lspull.*$/a #endif' \
                "$COMPAT_ASM"
          fi

          cat "$COMPAT_ASM"

      # --------------------------------------------------
      # 10. Full kernel build for Module.symvers
      # --------------------------------------------------
      - name: Build kernel and generate Module.symvers
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          make -j2 ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS=-fcommon \
            CC="${CROSS_COMPILE}gcc" \
            2>&1 | tee /tmp/kernel-build.log

          ls -lh Module.symvers

      # --------------------------------------------------
      # 11. Build AmneziaWG module
      # --------------------------------------------------
      - name: Build AmneziaWG
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          make -j2 \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS=-fcommon \
            CC="${CROSS_COMPILE}gcc" \
            M="$MODULE_DIR" \
            V=1 \
            modules \
            2>&1 | tee /tmp/build.log

      # --------------------------------------------------
      # 12. Verify module
      # --------------------------------------------------
      - name: Verify AmneziaWG module
        shell: bash
        run: |
          set -e

          MODULE="$KERNEL_DIR/$MODULE_DIR/amneziawg.ko"

          test -f "$MODULE"

          echo "===== MODULE ====="
          ls -lh "$MODULE"

          echo "===== FILE ====="
          file "$MODULE"

          echo "===== MODINFO ====="
          modinfo "$MODULE"

          echo "===== VERMAGIC ====="
          modinfo -F vermagic "$MODULE"

          echo "===== ARCH ====="
          readelf -h "$MODULE" | grep -E 'Class|Machine'

          echo "===== SHA256 ====="
          sha256sum "$MODULE"

      # --------------------------------------------------
      # 13. Upload module
      # --------------------------------------------------
      - name: Upload AmneziaWG module
        uses: actions/upload-artifact@v4
        with:
          name: E5885-AmneziaWG-ARMv7
          path: |
            drivers/net/amneziawg/amneziawg.ko
            drivers/net/amneziawg/Module.symvers
          if-no-files-found: error

      # --------------------------------------------------
      # 14. Upload logs on failure
      # --------------------------------------------------
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: E5885-AmneziaWG-Build-Logs
          path: |
            /tmp/build.log
            /tmp/kernel-build.log
          if-no-files-found: ignore
