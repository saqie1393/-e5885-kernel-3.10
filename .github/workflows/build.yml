name: Build AmneziaWG for E5885 (GCC 4.7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          bc \
          binutils-arm-linux-gnueabi \
          wget \
          xz-utils
        
    - name: Download and install GCC 4.7 ARM toolchain (binary)
      run: |
        # Linaro GCC 4.7 toolchain download karein
        cd /tmp
        wget https://releases.linaro.org/archive/13.06/components/toolchain/binaries/gcc-linaro-arm-linux-gnueabi-4.7.4-2013.06-1.tar.xz
        tar -xf gcc-linaro-arm-linux-gnueabi-4.7.4-2013.06-1.tar.xz
        sudo mv gcc-linaro-arm-linux-gnueabi-4.7.4-2013.06-1 /opt/gcc-4.7
        
        # PATH mein add karein
        echo "/opt/gcc-4.7/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE=arm-linux-gnueabi-" >> $GITHUB_ENV
        
        # Check version
        /opt/gcc-4.7/bin/arm-linux-gnueabi-gcc --version
    
    - name: Setup kernel build
      run: |
        cd kernel/e5885-kernel-3.10
        export PATH=/opt/gcc-4.7/bin:$PATH
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- mrproper
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- modules_prepare
        
    - name: Download AmneziaWG source
      run: |
        cd kernel/e5885-kernel-3.10
        git clone --branch v2.0 https://github.com/amnezia-vpn/amneziawg-go.git ../amneziawg
        ln -s ../amneziawg ./drivers/net/amneziawg
        cd drivers/net/amneziawg
        sed -i 's/CONFIG_ZINC_ARCH_ARM=y/CONFIG_ZINC_ARCH_ARM=n/g' Makefile 2>/dev/null || true
        
    - name: Build AmneziaWG module
      run: |
        cd kernel/e5885-kernel-3.10
        export PATH=/opt/gcc-4.7/bin:$PATH
        make -C . \
          M=drivers/net/amneziawg \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabi- \
          CC=arm-linux-gnueabi-gcc \
          CONFIG_ZINC_ARCH_ARM=n \
          V=1 \
          modules
    
    - name: Strip and verify module
      run: |
        cd kernel/e5885-kernel-3.10
        export PATH=/opt/gcc-4.7/bin:$PATH
        if [ -f drivers/net/amneziawg/amneziawg.ko ]; then
          cp drivers/net/amneziawg/amneziawg.ko ./
          arm-linux-gnueabi-strip --strip-unneeded amneziawg.ko
          
          echo "=== Module Information ==="
          file amneziawg.ko
          modinfo amneziawg.ko || true
          
          echo "=== Vermagic ==="
          modinfo amneziawg.ko | grep vermagic || echo "Vermagic not found"
        else
          echo "Module not found! Checking build directory..."
          find drivers -name "*.ko" -type f
          exit 1
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-e5885-gcc47
        path: kernel/e5885-kernel-3.10/amneziawg.ko
