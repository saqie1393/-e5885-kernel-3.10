name: Build AmneziaWG v1.0.20251104 (Clean - No Fixes)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.20251104'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Configure E5885 Kernel
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5885Ls-93a_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Clone AmneziaWG v1.0.20251104
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        git clone --branch v1.0.20251104 --depth 1 https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git ../amneziawg-kmod
        rm -rf drivers/net/amneziawg
        ln -s "$(realpath ../amneziawg-kmod/src)" drivers/net/amneziawg

    - name: Apply compatibility fixes
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        AWG_SRC="drivers/net/amneziawg"

        echo "=== 1. Fix ARM CPUID ==="
        sed -i '/#define read_cpuid_part() read_cpuid_part_number()/d' "$AWG_SRC/compat/compat.h" || true

        echo "=== 2. Fix fallthrough ==="
        printf '\n#ifndef fallthrough\n#define fallthrough\n#endif\n' >> "$AWG_SRC/compat/compat.h"

        echo "=== 3. Fix lspush/lspull redefines ==="
        COMPAT_ASM="$AWG_SRC/compat/compat-asm.h"
        if [ -f "$COMPAT_ASM" ]; then
          sed -i '/^#ifdef lspush$/,/^#endif$/d; /^#ifdef lspull$/,/^#endif$/d' "$COMPAT_ASM" || true
          sed -i 's|^#define[[:space:]]\+lspush\>|#ifndef lspush\n#define lspush|' "$COMPAT_ASM" || true
          sed -i 's|^#define[[:space:]]\+lspull\>|#ifndef lspull\n#define lspull|' "$COMPAT_ASM" || true
          awk '
            BEGIN { prev=""; }
            {
              if (prev ~ /^#ifndef lspush$/ && $0 ~ /^#define lspush/) { print $0; print "#endif"; prev=$0; next }
              if (prev ~ /^#ifndef lspull$/ && $0 ~ /^#define lspull/) { print $0; print "#endif"; prev=$0; next }
              print $0; prev=$0
            }
          ' "$COMPAT_ASM" > /tmp/compat-asm.tmp && mv /tmp/compat-asm.tmp "$COMPAT_ASM"
        fi

        echo "=== All fixes applied ==="

    - name: Build AmneziaWG (Clean - No Fixes)
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make -C . M=drivers/net/amneziawg ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc V=1 modules 2>&1 | tee /tmp/build.log
        echo ""
        echo "=== Build finished with exit code: $? ==="

    - name: Show Build Log Summary
      if: always()
      shell: bash
      run: |
        echo "=== Full Build Log (warnings/errors highlighted) ==="
        grep -iE "warning|error" /tmp/build.log || echo "No warnings or errors found"
        echo ""
        echo "=== Last 50 lines of build log ==="
        tail -50 /tmp/build.log 2>/dev/null || echo "build.log not found"

    - name: Strip and Verify Module
      if: success()
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        MODULE_PATH=$(find -L drivers/net/amneziawg -name "amneziawg.ko" -type f 2>/dev/null | head -1)
        if [ -z "$MODULE_PATH" ]; then echo "Module not found!"; exit 1; fi
        cp "$MODULE_PATH" "$GITHUB_WORKSPACE/amneziawg.ko"
        arm-linux-gnueabihf-strip --strip-unneeded "$GITHUB_WORKSPACE/amneziawg.ko"
        file "$GITHUB_WORKSPACE/amneziawg.ko"
        modinfo "$GITHUB_WORKSPACE/amneziawg.ko" 2>/dev/null | grep vermagic || true

    - name: Upload Build Log as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.event.inputs.version }}
        path: /tmp/build.log
        if-no-files-found: warn

    - name: Upload Module (if built)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-E5885-${{ github.event.inputs.version }}
        path: amneziawg.ko
        if-no-files-found: error

    - name: Create Release (if built)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: AmneziaWG E5885 ${{ github.event.inputs.version }}
        body: |
          AmneziaWG Kernel Module for Huawei E5885 (clean build, no manual fixes).
          Version: ${{ github.event.inputs.version }}
        files: amneziawg.ko
        draft: false
        prerelease: false
