
name: Build AmneziaWG for E5885 GCC 4.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install dependencies
      # ==========================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            python3 \
            git \
            cpio \
            rsync

      # ==========================================
      # 3. Extract Linaro GCC 4.7
      # ==========================================
      - name: Extract and setup Linaro GCC 4.7
        shell: bash
        run: |
          set -e

          GCC_ARCHIVE="gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2"

          if [ ! -f "$GCC_ARCHIVE" ]; then
            echo "ERROR: GCC archive not found!"
            ls -lah gcc/
            exit 1
          fi

          echo "=== Extracting GCC ==="

          sudo tar -xjf "$GCC_ARCHIVE" -C /opt/

          GCC_DIR="/opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux"

          if [ -d "$GCC_DIR" ]; then
            sudo mv "$GCC_DIR" /opt/gcc-4.7
          fi

          echo "=== Detect GCC executable ==="

          GCC_BIN="$(find /opt/gcc-4.7 -type f \
            -name arm-linux-gnueabihf-gcc | head -1)"

          if [ -z "$GCC_BIN" ]; then
            echo "ERROR: arm-linux-gnueabihf-gcc not found!"
            find /opt/gcc-4.7 -maxdepth 5 -type f
            exit 1
          fi

          GCC_BIN_DIR="$(dirname "$GCC_BIN")"

          echo "GCC_BIN=$GCC_BIN"
          echo "GCC_BIN_DIR=$GCC_BIN_DIR"

          chmod +x "$GCC_BIN"

          echo "$GCC_BIN_DIR" >> "$GITHUB_PATH"

          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
          echo "GCC_BIN=$GCC_BIN" >> "$GITHUB_ENV"
          echo "GCC_BIN_DIR=$GCC_BIN_DIR" >> "$GITHUB_ENV"

          # Current step PATH
          export PATH="$GCC_BIN_DIR:$PATH"

          echo "=== GCC version ==="
          "$GCC_BIN" --version

          echo "=== Compiler test ==="
          arm-linux-gnueabihf-gcc -v

      # ==========================================
      # 4. Detect kernel directory
      # ==========================================
      - name: Detect kernel directory
        shell: bash
        run: |
          set -e

          if [ -f Makefile ] && grep -q "mrproper" Makefile; then
            KERNEL_DIR="$PWD"

          elif [ -f kernel/Makefile ] && grep -q "mrproper" kernel/Makefile; then
            KERNEL_DIR="$PWD/kernel"

          elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
            KERNEL_DIR="$PWD/kernel/e5885-kernel-3.10"

          else
            echo "ERROR: Kernel Makefile not found!"
            ls -lah
            exit 1
          fi

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

          echo "=== Kernel directory ==="
          echo "$KERNEL_DIR"

          head -5 "$KERNEL_DIR/Makefile"

      # ==========================================
      # 5. Kernel defconfig
      # ==========================================
      - name: Setup E5885 kernel configuration
        shell: bash
        run: |
          set -e

          export PATH="$GCC_BIN_DIR:$PATH"

          cd "$KERNEL_DIR"

          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-

          echo "=== Using E5885 defconfig ==="

          make \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCFLAGS=-fcommon \
            hi6932_E5885Ls-93a_defconfig

          echo "=== Configuration completed ==="

          grep CONFIG_LOCALVERSION .config || true

      # ==========================================
      # 6. Prepare kernel
      # ==========================================
      - name: Prepare kernel headers
        shell: bash
        run: |
          set -e

          export PATH="$GCC_BIN_DIR:$PATH"

          cd "$KERNEL_DIR"

          make \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            HOSTCFLAGS=-fcommon \
            modules_prepare

      # ==========================================
      # 7. Clone AmneziaWG
      # ==========================================
      - name: Clone AmneziaWG kernel module
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          git clone \
            https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git \
            ../amneziawg-kmod

          ln -sfn \
            ../amneziawg-kmod/src \
            drivers/net/amneziawg

          echo "=== AmneziaWG source ==="

          ls -lah ../amneziawg-kmod/
          ls -lah ../amneziawg-kmod/src/

      # ==========================================
      # 8. Build AmneziaWG
      # ==========================================
      - name: Build AmneziaWG module
        shell: bash
        run: |
          set -o pipefail

          export PATH="$GCC_BIN_DIR:$PATH"

          cd "$KERNEL_DIR"

          echo "=== GCC ==="
          arm-linux-gnueabihf-gcc --version

          echo "=== Building AmneziaWG ==="

          make -C . \
            M=drivers/net/amneziawg \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            HOSTCFLAGS=-fcommon \
            CC=arm-linux-gnueabihf-gcc \
            V=1 \
            modules 2>&1 | tee /tmp/build.log

      # ==========================================
      # 9. Verify module
      # ==========================================
      - name: Strip and verify module
        shell: bash
        run: |
          set -e

          export PATH="$GCC_BIN_DIR:$PATH"

          cd "$KERNEL_DIR"

          MODULE_PATH="$(find . -name amneziawg.ko -type f | head -1)"

          if [ -z "$MODULE_PATH" ]; then
            echo "ERROR: amneziawg.ko not found!"

            echo "=== Available modules ==="
            find . -name "*.ko" -type f || true

            echo "=== Build log ==="
            tail -100 /tmp/build.log

            exit 1
          fi

          echo "=== Module found ==="
          echo "$MODULE_PATH"

          cp "$MODULE_PATH" "$GITHUB_WORKSPACE/amneziawg.ko"

          arm-linux-gnueabihf-strip \
            --strip-unneeded \
            "$GITHUB_WORKSPACE/amneziawg.ko"

          echo "=== Module file ==="
          file "$GITHUB_WORKSPACE/amneziawg.ko"

          echo "=== Vermagic ==="
          modinfo "$GITHUB_WORKSPACE/amneziawg.ko" | grep vermagic

          echo "=== Module size ==="
          ls -lh "$GITHUB_WORKSPACE/amneziawg.ko"

      # ==========================================
      # 10. Upload module
      # ==========================================
      - name: Upload AmneziaWG module
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-e5885-gcc47
          path: amneziawg.ko
          if-no-files-found: error

      # ==========================================
      # 11. Upload logs on failure
      # ==========================================
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e5885-build-error-log
          path: /tmp/build.log
          if-no-files-found: ignore
