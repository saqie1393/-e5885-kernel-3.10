name: Build AmneziaWG for E5885 (Local GCC 4.7 .deb)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Install GCC 4.7 from local .deb file
      run: |
        # Check ke file exist karti hai
        echo "=== Checking tools folder ==="
        ls -la tools/
        
        # .deb file install karein (exact filename match karein)
        sudo dpkg -i tools/gcc-4.7-arm-linux-gnuabi_4.7.4-3ubuntu12cross3_amd64.deb || true
        
        # Fix missing dependencies
        sudo apt-get install -f -y
        
        # Install other required packages
        sudo apt-get install -y \
          binutils-arm-linux-gnueabi \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          bc
        
        # Check installed GCC files
        echo "=== Searching for GCC 4.7 ==="
        find /usr -name "*gcc-4.7*" 2>/dev/null || true
        find /usr -name "*arm-linux-gnuabi-gcc*" 2>/dev/null || true
        
        # Agar GCC 4.7 available hai toh use karein
        if [ -f /usr/bin/arm-linux-gnuabi-gcc-4.7 ]; then
          sudo update-alternatives --install /usr/bin/arm-linux-gnuabi-gcc arm-linux-gnuabi-gcc /usr/bin/arm-linux-gnuabi-gcc-4.7 100
          sudo update-alternatives --set arm-linux-gnuabi-gcc /usr/bin/arm-linux-gnuabi-gcc-4.7
          echo "=== Using GCC 4.7 ==="
          arm-linux-gnuabi-gcc --version
          export CC=arm-linux-gnuabi-gcc
          export CROSS_COMPILE=arm-linux-gnuabi-
        else
          echo "=== GCC 4.7 not found, installing default GCC ==="
          sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          export CC=arm-linux-gnueabi-gcc
          export CROSS_COMPILE=arm-linux-gnueabi-
        fi
        
        # Set environment variables
        echo "CC=$CC" >> $GITHUB_ENV
        echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
    
    - name: Setup kernel build
      run: |
        cd kernel/e5885-kernel-3.10
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} mrproper
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} defconfig
        make ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} modules_prepare
        
    - name: Download AmneziaWG source
      run: |
        cd kernel/e5885-kernel-3.10
        git clone --branch v2.0 https://github.com/amnezia-vpn/amneziawg-go.git ../amneziawg
        ln -s ../amneziawg ./drivers/net/amneziawg
        cd drivers/net/amneziawg
        sed -i 's/CONFIG_ZINC_ARCH_ARM=y/CONFIG_ZINC_ARCH_ARM=n/g' Makefile 2>/dev/null || true
        
    - name: Build AmneziaWG module
      run: |
        cd kernel/e5885-kernel-3.10
        make -C . \
          M=drivers/net/amneziawg \
          ARCH=arm \
          CROSS_COMPILE=${CROSS_COMPILE} \
          CC=${CC} \
          CONFIG_ZINC_ARCH_ARM=n \
          V=1 \
          modules
    
    - name: Strip and verify module
      run: |
        cd kernel/e5885-kernel-3.10
        if [ -f drivers/net/amneziawg/amneziawg.ko ]; then
          cp drivers/net/amneziawg/amneziawg.ko ./
          ${CROSS_COMPILE}strip --strip-unneeded amneziawg.ko
          
          echo "=== Module Information ==="
          file amneziawg.ko
          modinfo amneziawg.ko || true
          
          echo "=== Vermagic ==="
          modinfo amneziawg.ko | grep vermagic || echo "Vermagic not found"
        else
          echo "Module not found! Checking build directory..."
          find drivers -name "*.ko" -type f
          exit 1
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-e5885-gcc47-local
        path: kernel/e5885-kernel-3.10/amneziawg.ko
