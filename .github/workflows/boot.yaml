name: Build AmneziaWG v1.0.20251104 + awg tool for E5885

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.20251104'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file patch wget xz-utils python3

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Configure E5885 Kernel (ARM)
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5785-92c_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Clone AmneziaWG Kernel Module v1.0.20251104
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        git clone --branch v1.0.20251104 --depth 1 https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git ../amneziawg-kmod
        rm -rf drivers/net/amneziawg
        ln -s "$(realpath ../amneziawg-kmod/src)" drivers/net/amneziawg

    - name: Apply compatibility patches (repo patch file)
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        AWG_SRC="drivers/net/amneziawg"
        PATCH_FILE="$GITHUB_WORKSPACE/patches/3.10-compat.patch"

        echo "=== Trying to apply permanent patch file ==="
        PATCH_APPLIED=1
        if [ -f "$PATCH_FILE" ]; then
          if git apply --check -p1 --directory=. "$PATCH_FILE" 2>/dev/null; then
            git apply -p1 "$PATCH_FILE"
            echo "✅ Patch applied via git apply"
          elif patch -p1 --dry-run --forward < "$PATCH_FILE" >/dev/null 2>&1; then
            patch -p1 --forward < "$PATCH_FILE"
            echo "✅ Patch applied via patch(1)"
          else
            echo "⚠️ Patch file did not apply cleanly — falling back to inline fixes"
            PATCH_APPLIED=0
          fi
        else
          echo "⚠️ Patch file not found — falling back to inline fixes"
          PATCH_APPLIED=0
        fi

        if [ "$PATCH_APPLIED" = "0" ]; then
          echo "=== Applying inline compatibility fixes ==="
          echo "--- 1. ARM CPUID ---"
          sed -i '/#define read_cpuid_part() read_cpuid_part_number()/d' "$AWG_SRC/compat/compat.h" || true

          echo "--- 2. fallthrough ---"
          if ! grep -q '^#ifndef fallthrough$' "$AWG_SRC/compat/compat.h"; then
            printf '\n#ifndef fallthrough\n#define fallthrough\n#endif\n' >> "$AWG_SRC/compat/compat.h"
          fi

          echo "--- 3. lspush/lspull ---"
          COMPAT_ASM="$AWG_SRC/compat/compat-asm.h"
          if [ -f "$COMPAT_ASM" ]; then
            sed -i '/^#ifdef lspush$/,/^#endif$/d; /^#ifdef lspull$/,/^#endif$/d' "$COMPAT_ASM" || true
            sed -i 's|^#define[[:space:]]\+lspush\>|#ifndef lspush\n#define lspush|' "$COMPAT_ASM" || true
            sed -i 's|^#define[[:space:]]\+lspull\>|#ifndef lspull\n#define lspull|' "$COMPAT_ASM" || true
            awk '
              BEGIN { prev=""; }
              {
                if (prev ~ /^#ifndef lspush$/ && $0 ~ /^#define lspush/) { print $0; print "#endif"; prev=$0; next }
                if (prev ~ /^#ifndef lspull$/ && $0 ~ /^#define lspull/) { print $0; print "#endif"; prev=$0; next }
                print $0; prev=$0
              }
            ' "$COMPAT_ASM" > /tmp/compat-asm.tmp && mv /tmp/compat-asm.tmp "$COMPAT_ASM"
          fi

          echo "--- 4. C90 warning silence ---"
          QUEUEING_H="$AWG_SRC/queueing.h"
          if [ -f "$QUEUEING_H" ]; then
            if ! grep -q 'diagnostic ignored "-Wdeclaration-after-statement"' "$QUEUEING_H"; then
              awk '
                BEGIN { inserted=0 }
                !inserted && /^[[:space:]]*\*\/[[:space:]]*$/ {
                  print; print "";
                  print "#pragma GCC diagnostic push";
                  print "#pragma GCC diagnostic ignored \"-Wdeclaration-after-statement\"";
                  inserted=1; next
                }
                { print }
              ' "$QUEUEING_H" > /tmp/queueing.tmp && mv /tmp/queueing.tmp "$QUEUEING_H"
              printf '\n#pragma GCC diagnostic pop\n' >> "$QUEUEING_H"
            fi
          fi

          echo "--- 5. netlink_ext_ack ---"
          DEVICE_C="$AWG_SRC/device.c"
          if [ -f "$DEVICE_C" ]; then
            if ! grep -q '^struct netlink_ext_ack;' "$DEVICE_C"; then
              sed -i '1s/^/#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)\nstruct netlink_ext_ack;\n#endif\n/' "$DEVICE_C"
            fi
          fi
          echo "=== Inline fixes applied ==="
        fi
        echo "=== All compatibility handling done ==="

    - name: Add NEON compatibility files
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        AWG_SRC="drivers/net/amneziawg"
        NEON_DIR="$GITHUB_WORKSPACE/patches/neon"

        echo "=== 1. Copying kmode_neon.c ==="
        mkdir -p "$AWG_SRC/compat/neon-arm"
        cp "$NEON_DIR/kmode_neon.c" "$AWG_SRC/compat/neon-arm/kmode_neon.c"
        echo "✅ kmode_neon.c copied"

        echo "=== 2. Copying compat chacha.h ==="
        mkdir -p "$AWG_SRC/compat/crypto/chacha/include/crypto"
        cp "$NEON_DIR/chacha.h" "$AWG_SRC/compat/crypto/chacha/include/crypto/chacha.h"
        echo "✅ chacha.h copied"

        echo "=== 3. Updating compat/simd-asm/include/asm/simd.h ==="
        SIMD_H="$AWG_SRC/compat/simd-asm/include/asm/simd.h"
        if [ -f "$SIMD_H" ]; then
          if ! grep -q 'AWG_PRIVATE_KMODE_NEON' "$SIMD_H"; then
            python3 -c "
import sys
path = sys.argv[1]
with open(path) as f:
    c = f.read()
old = '''static __must_check inline bool may_use_simd(void)
{
#if defined(CONFIG_X86_64)
\treturn irq_fpu_usable();
#elif defined(CONFIG_ARM64) && defined(CONFIG_KERNEL_MODE_NEON)
\treturn true;
#elif defined(CONFIG_ARM) && defined(CONFIG_KERNEL_MODE_NEON)
\treturn !in_nmi() && !in_irq() && !in_serving_softirq();
#else
\treturn false;
#endif
}'''
new = '''#ifdef AWG_PRIVATE_KMODE_NEON
extern bool awg_kmode_neon_enabled;
#endif

static __must_check inline bool may_use_simd(void)
{
#if defined(CONFIG_X86_64)
\treturn irq_fpu_usable();
#elif defined(CONFIG_ARM64) && defined(CONFIG_KERNEL_MODE_NEON)
\treturn true;
#elif defined(CONFIG_ARM) && defined(AWG_PRIVATE_KMODE_NEON)
\treturn awg_kmode_neon_enabled && !in_nmi() && !in_irq() && !in_serving_softirq();
#elif defined(CONFIG_ARM) && defined(CONFIG_KERNEL_MODE_NEON)
\treturn !in_nmi() && !in_irq() && !in_serving_softirq();
#else
\treturn false;
#endif
}'''
if old not in c:
    print('ERROR: simd.h pattern not found', file=sys.stderr)
    sys.exit(1)
c = c.replace(old, new)
with open(path, 'w') as f:
    f.write(c)
" "$SIMD_H"
            echo "✅ simd.h updated"
          else
            echo "ℹ️ simd.h already contains NEON changes"
          fi
        else
          echo "⚠️ simd.h not found, skipping"
        fi

        echo "=== 4. Updating Kbuild (NEON flags + kmode_neon.o) ==="
        KBUILD="$AWG_SRC/Kbuild"
        if [ -f "$KBUILD" ]; then
          if ! grep -q 'AWG_PRIVATE_KMODE_NEON' "$KBUILD"; then
            sed -i '/^amneziawg-y :=/i ccflags-y += -DCONFIG_KERNEL_MODE_NEON=1 -DAWG_PRIVATE_KMODE_NEON\nasflags-y += -DCONFIG_KERNEL_MODE_NEON=1\n\n# Linux 3.10 Balong: run zinc init and self-tests at module load\nccflags-y += -DCOMPAT_INIT_CRYPTO -DCONFIG_ZINC_SELFTEST=1\n' "$KBUILD"
            sed -i '/^include \$(src)\/compat\/Kbuild.include/a amneziawg-y += compat/neon-arm/kmode_neon.o' "$KBUILD"
            echo "✅ Kbuild updated"
          else
            echo "ℹ️ Kbuild already contains NEON changes"
          fi
        else
          echo "⚠️ Kbuild not found, skipping"
        fi

        echo "=== 5. Updating main.c (awg_kmode_neon_init call) ==="
        MAIN_C="$AWG_SRC/main.c"
        if [ -f "$MAIN_C" ]; then
          if ! grep -q 'awg_kmode_neon_init' "$MAIN_C"; then
            python3 -c "
import sys
path = sys.argv[1]
with open(path) as f:
    c = f.read()
c = c.replace(
    '#include <net/rtnetlink.h>\n',
    '#include <net/rtnetlink.h>\n\n#ifdef AWG_PRIVATE_KMODE_NEON\nvoid awg_kmode_neon_init(void);\n#endif\n',
    1)
c = c.replace(
    'static int __init wg_mod_init(void)\n{\n\tint ret;\n',
    'static int __init wg_mod_init(void)\n{\n\tint ret;\n\n#ifdef AWG_PRIVATE_KMODE_NEON\n\tawg_kmode_neon_init();\n#endif\n',
    1)
with open(path, 'w') as f:
    f.write(c)
" "$MAIN_C"
            echo "✅ main.c updated"
          else
            echo "ℹ️ main.c already contains NEON changes"
          fi
        else
          echo "⚠️ main.c not found, skipping"
        fi

        echo "=== 6. Updating socket.c (ip6_dst_lookup_flow) ==="
        SOCKET_C="$AWG_SRC/socket.c"
        if [ -f "$SOCKET_C" ] && ! grep -q 'ipv6_stub->ipv6_dst_lookup_flow' "$SOCKET_C"; then
          sed -i 's|dst = ip6_dst_lookup_flow(sock_net(sock), sock, \&fl, NULL);|#if LINUX_VERSION_CODE < KERNEL_VERSION(3, 12, 0)\n\t\tdst = ipv6_stub->ipv6_dst_lookup_flow(sock_net(sock), sock, \&fl, NULL);\n#else\n\t\tdst = ip6_dst_lookup_flow(sock_net(sock), sock, \&fl, NULL);\n#endif|' "$SOCKET_C"
          echo "✅ socket.c updated"
        else
          echo "ℹ️ socket.c already updated or not found"
        fi

        echo "=== 7. Updating send.c / receive.c (cond_resched with NEON) ==="
        for f in send.c receive.c; do
          F="$AWG_SRC/$f"
          [ -f "$F" ] || continue
          if ! grep -q 'never schedule' "$F"; then
            python3 -c "
import sys
path = sys.argv[1]
with open(path) as f:
    c = f.read()
c = c.replace(
    '''#ifdef COMPAT_CRYPTO_IS_ZINC
\t\tsimd_relax(&simd_context);
#endif
\t\tif (need_resched())
\t\t\tcond_resched();
#ifdef COMPAT_CRYPTO_IS_ZINC''',
    '''#ifdef COMPAT_CRYPTO_IS_ZINC
\t\tsimd_relax(&simd_context);
\t\t/* On 3.10 cond_resched() ignores preempt_count: never schedule
\t\t * with NEON held. simd_relax() or simd_put() will reschedule. */
\t\tif (need_resched() && !(simd_context & HAVE_SIMD_IN_USE))
\t\t\tcond_resched();
#else
\t\tif (need_resched())
\t\t\tcond_resched();
#endif
#ifdef COMPAT_CRYPTO_IS_ZINC''')
with open(path, 'w') as f:
    f.write(c)
" "$F"
            echo "✅ $f updated"
          else
            echo "ℹ️ $f already updated"
          fi
        done

        echo "=== NEON compatibility files added ==="

    - name: Build AmneziaWG Kernel Module
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make -C . M=drivers/net/amneziawg ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc V=1 modules 2>&1 | tee /tmp/build.log

    - name: Show Kernel Build Log Summary
      if: always()
      shell: bash
      run: |
        echo "=== Kernel build warnings/errors ==="
        grep -iE "warning|error" /tmp/build.log || echo "No warnings or errors found"

    - name: Strip and Verify Kernel Module
      if: success()
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        MODULE_PATH=$(find -L drivers/net/amneziawg -name "amneziawg.ko" -type f 2>/dev/null | head -1)
        if [ -z "$MODULE_PATH" ]; then echo "Module not found!"; exit 1; fi
        cp "$MODULE_PATH" "$GITHUB_WORKSPACE/amneziawg.ko"
        arm-linux-gnueabihf-strip --strip-unneeded "$GITHUB_WORKSPACE/amneziawg.ko"
        file "$GITHUB_WORKSPACE/amneziawg.ko"
        modinfo "$GITHUB_WORKSPACE/amneziawg.ko" 2>/dev/null | grep vermagic || true

    - name: Clone and Build awg tool v1.0.20260223 (static ARMv7, musl)
      shell: bash
      run: |
        TOOLS_DIR="amneziawg-tools-src"

        echo "=== Downloading musl toolchain from landley.net ==="
        MUSL_URL="https://landley.net/bin/toolchains/latest/armv7l-linux-musleabihf-cross.tar.xz"
        wget -q "$MUSL_URL" -O /tmp/musl-cross.tar.xz
        tar -xJf /tmp/musl-cross.tar.xz -C /opt/
        export PATH="/opt/armv7l-linux-musleabihf-cross/bin:$PATH"
        armv7l-linux-musleabihf-gcc --version

        echo "=== Cloning amneziawg-tools v1.0.20260223 ==="
        git clone --branch v1.0.20260223 --depth 1 https://github.com/amnezia-vpn/amneziawg-tools.git "../$TOOLS_DIR"
        cd "../$TOOLS_DIR/src"

        echo "=== Checking for wireguard.h ==="
        find . -name "wireguard.h" -type f 2>/dev/null || echo "wireguard.h NOT FOUND"

        if [ -f uapi/linux/linux/wireguard.h ] && [ ! -f uapi/linux/wireguard.h ]; then
          ln -s linux/wireguard.h uapi/linux/wireguard.h
          echo "Created symlink: uapi/linux/wireguard.h -> linux/wireguard.h"
        fi

        echo "=== Building awg statically for ARMv7 (musl) ==="
        export CC=armv7l-linux-musleabihf-gcc
        export CFLAGS="-Os -flto -ffunction-sections -fdata-sections -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -static"
        export LDFLAGS="-static -s -Wl,--gc-sections"

        make CC="$CC" \
             LDFLAGS="$LDFLAGS" \
             RUNSTATEDIR=/var/run \
             WITH_WGQUICK=yes \
             WITH_BASHCOMPLETION=no \
             WITH_SYSTEMDUNITS=no \
             PREFIX=/usr \
             DESTDIR="$GITHUB_WORKSPACE/awg-tools-out" \
             2>&1 | tee /tmp/tools-build.log

        echo "=== Installing awg to output directory ==="
        make install \
             CC="$CC" \
             LDFLAGS="$LDFLAGS" \
             RUNSTATEDIR=/var/run \
             WITH_WGQUICK=yes \
             WITH_BASHCOMPLETION=no \
             WITH_SYSTEMDUNITS=no \
             PREFIX=/usr \
             DESTDIR="$GITHUB_WORKSPACE/awg-tools-out" \
             2>&1 | tee -a /tmp/tools-build.log

        echo "=== Verifying awg binary ==="
        file "$GITHUB_WORKSPACE/awg-tools-out/usr/bin/awg" || true
        ls -la "$GITHUB_WORKSPACE/awg-tools-out/usr/bin/awg" || true

    - name: Show awg binary size (summary)
      if: success()
      shell: bash
      run: |
        AWG_BIN="$GITHUB_WORKSPACE/awg-tools-out/usr/bin/awg"
        if [ ! -f "$AWG_BIN" ]; then
          echo "ERROR: awg binary not found!"; exit 1
        fi
        echo "=========================================="
        echo " awg binary details"
        echo "=========================================="
        file "$AWG_BIN"
        echo "------------------------------------------"
        echo "Size (human readable): $(du -h "$AWG_BIN" | cut -f1)"
        echo "Size (bytes): $(stat -c %s "$AWG_BIN")"
        echo "=========================================="
        echo "✅ If size is ~100-130 KB, musl static build worked correctly."
        echo "=========================================="

    - name: Show Tools Build Log Summary
      if: always()
      shell: bash
      run: |
        echo "=== Tools build warnings/errors ==="
        grep -iE "warning|error" /tmp/tools-build.log || echo "No warnings or errors found"

    - name: Package awg tool (awg only) into tar.gz
      if: success()
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        mkdir -p awg-tools-release
        if [ ! -f awg-tools-out/usr/bin/awg ]; then
          echo "ERROR: awg binary not found!"
          exit 1
        fi
        cp awg-tools-out/usr/bin/awg awg-tools-release/
        chmod +x awg-tools-release/awg

        tar -czf awg-tools-armv7.tar.gz -C awg-tools-release .
        echo "=== Tarball created ==="
        ls -la awg-tools-armv7.tar.gz
        echo "Tarball size: $(du -h awg-tools-armv7.tar.gz | cut -f1)"
        echo "=== Contents of tarball ==="
        tar -tzf awg-tools-armv7.tar.gz

    - name: Upload Kernel Module Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-ko-${{ github.event.inputs.version }}
        path: amneziawg.ko
        if-no-files-found: error

    - name: Upload awg Tool Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: awg-tool-${{ github.event.inputs.version }}
        path: awg-tools-armv7.tar.gz
        if-no-files-found: error

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.event.inputs.version }}
        path: |
          /tmp/build.log
          /tmp/tools-build.log
        if-no-files-found: warn

    # ================= RELEASE FIX =================
    - name: Create Tag (Release ke liye zaroori)
      if: success()
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f ${{ github.event.inputs.version }}
        git push origin -f ${{ github.event.inputs.version }}

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: AmneziaWG E5885 ${{ github.event.inputs.version }}
        overwrite: true
        files: |
          amneziawg.ko
          awg-tools-armv7.tar.gz
        body: |
          AmneziaWG for Huawei E5885 (kernel 3.10)

          **Contents:**
          - `amneziawg.ko` — Kernel module (vermagic 3.10.100+ ARMv7)
          - `awg-tools-armv7.tar.gz` — Static `awg` binary for ARMv7 (musl, ~120 KB)

          **Note:** `awg-quick` is intentionally excluded because it requires `bash`, which is not available on E5885 (BusyBox `ash` only).

          **Install:**
          ```sh
          insmod /system/modules/amneziawg.ko
          tar -xzf awg-tools-armv7.tar.gz -C /usr/bin/
          chmod +x /usr/bin/awg
          awg --version
