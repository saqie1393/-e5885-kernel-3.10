name: Build ipset modules for E5885

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0-ipset'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file patch

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Enable ipset in defconfig
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        DEFCONFIG="arch/arm/configs/hi6932_E5885Ls-93a_defconfig"
        for opt in \
          "CONFIG_NETFILTER_ADVANCED=y" \
          "CONFIG_IP_SET=m" \
          "CONFIG_IP_SET_MAX=256" \
          "CONFIG_IP_SET_BITMAP_IP=m" \
          "CONFIG_IP_SET_BITMAP_IPMAC=m" \
          "CONFIG_IP_SET_BITMAP_PORT=m" \
          "CONFIG_IP_SET_HASH_IP=m" \
          "CONFIG_IP_SET_HASH_IPMARK=m" \
          "CONFIG_IP_SET_HASH_IPPORT=m" \
          "CONFIG_IP_SET_HASH_IPPORTIP=m" \
          "CONFIG_IP_SET_HASH_IPPORTNET=m" \
          "CONFIG_IP_SET_HASH_NET=m" \
          "CONFIG_IP_SET_HASH_NETNET=m" \
          "CONFIG_IP_SET_HASH_NETPORT=m" \
          "CONFIG_IP_SET_HASH_MAC=m" \
          "CONFIG_IP_SET_LIST_SET=m" \
          "CONFIG_NETFILTER_XT_SET=m"
        do
          key="${opt%%=*}"
          if grep -q "^${key}=" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^${key}=.*|${opt}|" "$DEFCONFIG"
          elif grep -q "^# ${key} is not set" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^# ${key} is not set|${opt}|" "$DEFCONFIG"
          else
            echo "$opt" >> "$DEFCONFIG"
          fi
        done

    - name: Configure E5885 Kernel (ARM)
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5885Ls-93a_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Build ipset modules
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make -C . M=net/netfilter/ipset ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc modules 2>&1 | tee /tmp/ipset-build.log
        make -C . M=net/netfilter ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc modules 2>&1 | tee -a /tmp/ipset-build.log

    - name: Strip and Verify ipset modules
      if: success()
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        mkdir -p "$GITHUB_WORKSPACE/ipset-modules"
        find net/netfilter -name "ip_set*.ko" -exec cp {} "$GITHUB_WORKSPACE/ipset-modules/" \;
        cp net/netfilter/xt_set.ko "$GITHUB_WORKSPACE/ipset-modules/" 2>/dev/null || true
        for ko in "$GITHUB_WORKSPACE/ipset-modules/"*.ko; do
          arm-linux-gnueabihf-strip --strip-unneeded "$ko"
          file "$ko"
          modinfo "$ko" 2>/dev/null | grep vermagic || true
        done
        tar -czf "$GITHUB_WORKSPACE/ipset-modules-armv7.tar.gz" -C "$GITHUB_WORKSPACE/ipset-modules" .

    - name: Build libmnl for ARMv7 musl (static)
      shell: bash
      run: |
        MUSL_URL="https://landley.net/bin/toolchains/latest/armv7l-linux-musleabihf-cross.tar.xz"
        wget -q "$MUSL_URL" -O /tmp/musl-cross.tar.xz
        tar -xJf /tmp/musl-cross.tar.xz -C /opt/
        export PATH="/opt/armv7l-linux-musleabihf-cross/bin:$PATH"

        export CC=armv7l-linux-musleabihf-gcc
        export CFLAGS="-Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
        export LDFLAGS="-static -s"

        wget -q https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2 -O /tmp/libmnl-1.0.5.tar.bz2
        tar -xjf /tmp/libmnl-1.0.5.tar.bz2 -C /tmp/
        cd /tmp/libmnl-1.0.5

        ./configure \
          --host=armv7l-linux-musleabihf \
          --prefix=/tmp/libmnl-install \
          --enable-static=yes \
          --enable-shared=no

        make -j$(nproc)
        make install

    - name: Build ipset userspace binary (STATIC ARMv7, libtool bypass)
      shell: bash
      run: |
        MUSL_URL="https://landley.net/bin/toolchains/latest/armv7l-linux-musleabihf-cross.tar.xz"
        wget -q "$MUSL_URL" -O /tmp/musl-cross.tar.xz
        tar -xJf /tmp/musl-cross.tar.xz -C /opt/
        export PATH="/opt/armv7l-linux-musleabihf-cross/bin:$PATH"

        export PKG_CONFIG_PATH="/tmp/libmnl-install/lib/pkgconfig:$PKG_CONFIG_PATH"
        export CC=armv7l-linux-musleabihf-gcc
        export CFLAGS="-Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -fno-pie -I/tmp/libmnl-install/include"
        export LDFLAGS="-static -s -Wl,-no-pie -L/tmp/libmnl-install/lib"

        wget -q https://www.netfilter.org/pub/ipset/ipset-7.10.tar.bz2 -O /tmp/ipset-7.10.tar.bz2
        tar -xjf /tmp/ipset-7.10.tar.bz2 -C /tmp/
        cd /tmp/ipset-7.10

        # musl fix: basename() ke liye libgen.h include karein (yeh 7.10 mein bhi zaroori hai)
        sed -i '1s/^/#include <libgen.h>\n/' src/ipset.c
        
        ./configure \
          --host=armv7l-linux-musleabihf \
          --prefix=/usr \
          --enable-static=yes \
          --enable-shared=no \
          --with-kmod=no

        # Compile karein (link libtool karega, lekin hum usay bypass karenge)
        make -j$(nproc) 2>&1 | tee /tmp/ipset-build.log

        # === ASAL FIX: libtool bypass, directly .a files se static link ===
        cd /tmp/ipset-6.38/src
        armv7l-linux-musleabihf-gcc \
          -static -s -Wl,-no-pie \
          -o /tmp/ipset-static \
          ipset.o ui.o \
          ../lib/.libs/libipset.a \
          /tmp/libmnl-install/lib/libmnl.a \
          -lm

        echo "=== Verifying ipset binary ==="
        file /tmp/ipset-static
        ls -la /tmp/ipset-static

        # STATIC VERIFICATION: agar dynamically linked hai to build FAIL karein
        if file /tmp/ipset-static | grep -q "dynamically linked"; then
          echo "::error::ERROR: ipset is DYNAMICALLY linked!"
          exit 1
        fi
        if ! file /tmp/ipset-static | grep -q "statically linked"; then
          echo "::error::ERROR: ipset is NOT statically linked!"
          exit 1
        fi
        echo "OK: ipset is STATICALLY linked"

    - name: Package ipset binary
      if: success()
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        mkdir -p ipset-release
        cp /tmp/ipset-static ipset-release/ipset
        chmod +x ipset-release/ipset
        tar -czf ipset-armv7.tar.gz -C ipset-release .

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: ipset E5885 ${{ github.event.inputs.version }}
        overwrite_files: true
        files: |
          ipset-modules-armv7.tar.gz
          ipset-armv7.tar.gz
        body: |
          ipset for Huawei E5885 (kernel 3.10)
          - `ipset-modules-armv7.tar.gz` — kernel modules
          - `ipset-armv7.tar.gz` — STATIC `ipset` userspace binary
          **Install:**
          ```sh
          tar -xzf ipset-modules-armv7.tar.gz -C /system/modules/
          insmod /system/modules/ip_set.ko
          insmod /system/modules/ip_set_hash_ip.ko
          insmod /system/modules/xt_set.ko
