name: Build xt_connbytes module for E5885

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0-connbytes'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file patch

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Enable xt_connbytes in defconfig
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        DEFCONFIG="arch/arm/configs/hi6932_E5885Ls-93a_defconfig"

        for opt in \
          "CONFIG_NETFILTER_ADVANCED=y" \
          "CONFIG_NETFILTER_XT_MATCH_CONNBYTES=m"
        do
          key="${opt%%=*}"
          if grep -q "^${key}=" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^${key}=.*|${opt}|" "$DEFCONFIG"
          elif grep -q "^# ${key} is not set" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^# ${key} is not set|${opt}|" "$DEFCONFIG"
          else
            echo "$opt" >> "$DEFCONFIG"
          fi
        done

        echo "===== defconfig mein connbytes line ====="
        grep "CONNBYTES" "$DEFCONFIG" || echo "NOT FOUND"

    - name: Configure Kernel (ARM)
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5885Ls-93a_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Verify connbytes enabled in .config
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        grep "CONFIG_NETFILTER_XT_MATCH_CONNBYTES" .config || echo "NOT FOUND in .config!"
        if ! grep -q "^CONFIG_NETFILTER_XT_MATCH_CONNBYTES=m" .config; then
          echo "::error::CONFIG_NETFILTER_XT_MATCH_CONNBYTES is NOT enabled"
          exit 1
        fi

    - name: Build xt_connbytes module
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make -C . M=net/netfilter ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc modules 2>&1 | tee /tmp/connbytes-build.log

    - name: Strip and Package
      if: success()
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        mkdir -p "$GITHUB_WORKSPACE/connbytes-out"

        cp net/netfilter/xt_connbytes.ko "$GITHUB_WORKSPACE/connbytes-out/" 2>/dev/null || true

        if [ ! -f "$GITHUB_WORKSPACE/connbytes-out/xt_connbytes.ko" ]; then
          echo "::error::xt_connbytes.ko was NOT built!"
          exit 1
        fi

        arm-linux-gnueabihf-strip --strip-unneeded "$GITHUB_WORKSPACE/connbytes-out/xt_connbytes.ko"
        file "$GITHUB_WORKSPACE/connbytes-out/xt_connbytes.ko"

        tar -czf "$GITHUB_WORKSPACE/xt_connbytes-armv7.tar.gz" -C "$GITHUB_WORKSPACE/connbytes-out" .

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: xt_connbytes E5885 ${{ github.event.inputs.version }}
        overwrite_files: true
        files: |
          xt_connbytes-armv7.tar.gz
        body: |
          xt_connbytes module for Huawei E5885 (kernel 3.10)

          **Install:**
          ```sh
          insmod /system/modules/xt_connbytes.ko
