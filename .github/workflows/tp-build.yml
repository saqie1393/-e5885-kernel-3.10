name: Build TPROXY + ipset + extra modules for E5885

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0-netfilter'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file patch wget xz-utils

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Enable TPROXY + ipset + extra modules in defconfig
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        DEFCONFIG="arch/arm/configs/hi6932_E5885Ls-93a_defconfig"

        # Core netfilter options
        # TPROXY needs NETFILTER_TPROXY and NF_DEFRAG_IPV4 [citation:1][citation:6]
        # xt_socket needs NF_CONNTRACK
        # xt_NFQUEUE needs NETFILTER_NETLINK_QUEUE
        # xt_connbytes needs NF_CONNTRACK
        for opt in \
          "CONFIG_NETFILTER_ADVANCED=y" \
          "CONFIG_NETFILTER_TPROXY=m" \
          "CONFIG_NETFILTER_XT_TARGET_TPROXY=m" \
          "CONFIG_NETFILTER_XT_MATCH_SOCKET=m" \
          "CONFIG_NF_DEFRAG_IPV4=y" \
          "CONFIG_NETFILTER_XT_TARGET_MARK=m" \
          "CONFIG_NETFILTER_XT_MATCH_MARK=m" \
          "CONFIG_IP_NF_MANGLE=m" \
          "CONFIG_NF_CONNTRACK=m" \
          "CONFIG_NF_CONNTRACK_IPV4=m" \
          "CONFIG_NF_NAT=m" \
          "CONFIG_NETFILTER_NETLINK=m" \
          "CONFIG_NETFILTER_NETLINK_QUEUE=m" \
          "CONFIG_NETFILTER_XT_TARGET_NFQUEUE=m" \
          "CONFIG_NETFILTER_XT_MATCH_CONNBYTES=m" \
          "CONFIG_NETFILTER_XT_MATCH_STATE=m" \
          "CONFIG_IP_SET=m" \
          "CONFIG_IP_SET_MAX=256" \
          "CONFIG_IP_SET_BITMAP_IP=m" \
          "CONFIG_IP_SET_BITMAP_IPMAC=m" \
          "CONFIG_IP_SET_BITMAP_PORT=m" \
          "CONFIG_IP_SET_HASH_IP=m" \
          "CONFIG_IP_SET_HASH_IPMARK=m" \
          "CONFIG_IP_SET_HASH_IPPORT=m" \
          "CONFIG_IP_SET_HASH_IPPORTIP=m" \
          "CONFIG_IP_SET_HASH_IPPORTNET=m" \
          "CONFIG_IP_SET_HASH_NET=m" \
          "CONFIG_IP_SET_HASH_NETNET=m" \
          "CONFIG_IP_SET_HASH_NETPORT=m" \
          "CONFIG_IP_SET_HASH_MAC=m" \
          "CONFIG_IP_SET_LIST_SET=m" \
          "CONFIG_NETFILTER_XT_SET=m"
        do
          key="${opt%%=*}"
          if grep -q "^${key}=" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^${key}=.*|${opt}|" "$DEFCONFIG"
          elif grep -q "^# ${key} is not set" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^# ${key} is not set|${opt}|" "$DEFCONFIG"
          else
            echo "$opt" >> "$DEFCONFIG"
          fi
        done

        echo "===== Relevant lines in defconfig ====="
        grep -E "TPROXY|XT_MATCH_SOCKET|XT_TARGET_NFQUEUE|XT_MATCH_CONNBYTES|NF_CONNTRACK|IP_SET|NF_DEFRAG" "$DEFCONFIG" || true

    - name: Configure Kernel (ARM)
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5885Ls-93a_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Verify key options in .config
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        echo "===== .config key lines ====="
        grep -E "CONFIG_NETFILTER_XT_TARGET_TPROXY|CONFIG_NETFILTER_XT_MATCH_SOCKET|CONFIG_NETFILTER_XT_TARGET_NFQUEUE|CONFIG_NETFILTER_XT_MATCH_CONNBYTES|CONFIG_NF_CONNTRACK=|CONFIG_IP_SET=|CONFIG_NETFILTER_NETLINK=" .config || true
        if ! grep -q "^CONFIG_NETFILTER_XT_TARGET_TPROXY=m" .config; then
          echo "::error::CONFIG_NETFILTER_XT_TARGET_TPROXY is NOT enabled"
          exit 1
        fi
        if ! grep -q "^CONFIG_NETFILTER_XT_MATCH_SOCKET=m" .config; then
          echo "::error::CONFIG_NETFILTER_XT_MATCH_SOCKET is NOT enabled"
          exit 1
        fi

    - name: Build netfilter + ipset modules
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        # Build all netfilter modules (includes TPROXY, socket, NFQUEUE, connbytes, etc.)
        make -C . M=net/netfilter ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc modules 2>&1 | tee /tmp/netfilter-build.log
        # Build ipset modules
        make -C . M=net/netfilter/ipset ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc modules 2>&1 | tee -a /tmp/netfilter-build.log

    - name: Collect and verify kernel modules
      if: success()
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        mkdir -p "$GITHUB_WORKSPACE/modules-out"

        # Copy everything that exists; harmless if missing
        copy_if() { [ -f "$1" ] && cp "$1" "$GITHUB_WORKSPACE/modules-out/" || true; }

        # TPROXY related
        copy_if net/netfilter/xt_TPROXY.ko
        copy_if net/netfilter/xt_socket.ko
        copy_if net/netfilter/xt_mark.ko
        copy_if net/netfilter/nf_tproxy_core.ko
        find net/ipv4/netfilter -name "*defrag*.ko" -exec cp {} "$GITHUB_WORKSPACE/modules-out/" \; 2>/dev/null || true

        # Extra modules (may be =y built-in, hence .ko may not exist)
        copy_if net/netfilter/nfnetlink.ko
        copy_if net/netfilter/nf_conntrack.ko
        copy_if net/netfilter/nfnetlink_queue.ko
        copy_if net/netfilter/xt_NFQUEUE.ko
        copy_if net/netfilter/xt_connbytes.ko

        # ipset modules
        find net/netfilter -name "ip_set*.ko" -exec cp {} "$GITHUB_WORKSPACE/modules-out/" \; 2>/dev/null || true
        copy_if net/netfilter/xt_set.ko

        # SMART VERIFICATION: for each interesting module, if it's =m but .ko missing → fail.
        # If it's =y (built-in) → OK, no .ko expected.
        MISSING=0
        for name in xt_TPROXY xt_socket xt_NFQUEUE xt_connbytes nf_conntrack nfnetlink nfnetlink_queue; do
          ko="$GITHUB_WORKSPACE/modules-out/${name}.ko"
          cfg_m=$(grep -c "^CONFIG_.*${name^^}=m$" .config 2>/dev/null || true)
          # Fallback: broad grep (name may not map exactly to CONFIG_ key)
          if [ -f "$ko" ]; then
            echo "OK   $name.ko present"
          else
            if grep -qE "^CONFIG_(NETFILTER_)?(XT_)?${name//_/}=y$" .config 2>/dev/null \
               || grep -qE "CONFIG_.*${name^^}=y" .config 2>/dev/null; then
              echo "SKIP $name (built-in =y in kernel, no .ko expected)"
            else
              echo "::warning::$name.ko not built and not built-in — may be missing"
              MISSING=$((MISSING+1))
            fi
          fi
        done

        # xt_TPROXY.ko MUST exist as a real module (that's the whole point)
        if [ ! -f "$GITHUB_WORKSPACE/modules-out/xt_TPROXY.ko" ]; then
          echo "::error::xt_TPROXY.ko missing — TPROXY is not built as a module"
          exit 1
        fi

        # If more than half of the optional modules are missing, hard fail
        if [ "$MISSING" -gt 3 ]; then
          echo "::error::too many expected modules are missing ($MISSING)"
          exit 1
        fi

        # Strip and verify
        for ko in "$GITHUB_WORKSPACE/modules-out/"*.ko; do
          arm-linux-gnueabihf-strip --strip-unneeded "$ko" 2>/dev/null || true
          file "$ko"
          modinfo "$ko" 2>/dev/null | grep vermagic || true
        done

        tar -czf "$GITHUB_WORKSPACE/netfilter-modules-armv7.tar.gz" -C "$GITHUB_WORKSPACE/modules-out" .

    - name: Build libmnl for ARMv7 musl (static)
      shell: bash
      run: |
        MUSL_URL="https://landley.net/bin/toolchains/latest/armv7l-linux-musleabihf-cross.tar.xz"
        wget -q "$MUSL_URL" -O /tmp/musl-cross.tar.xz
        tar -xJf /tmp/musl-cross.tar.xz -C /opt/
        export PATH="/opt/armv7l-linux-musleabihf-cross/bin:$PATH"

        export CC=armv7l-linux-musleabihf-gcc
        export CFLAGS="-Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"
        export LDFLAGS="-static -s"

        wget -q https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2 -O /tmp/libmnl-1.0.5.tar.bz2
        tar -xjf /tmp/libmnl-1.0.5.tar.bz2 -C /tmp/
        cd /tmp/libmnl-1.0.5

        ./configure \
          --host=armv7l-linux-musleabihf \
          --prefix=/tmp/libmnl-install \
          --enable-static=yes \
          --enable-shared=no

        make -j$(nproc)
        make install

    - name: Build ipset userspace binary (static ARMv7, ipset 6.38)
      shell: bash
      run: |
        MUSL_URL="https://landley.net/bin/toolchains/latest/armv7l-linux-musleabihf-cross.tar.xz"
        wget -q "$MUSL_URL" -O /tmp/musl-cross.tar.xz
        tar -xJf /tmp/musl-cross.tar.xz -C /opt/
        export PATH="/opt/armv7l-linux-musleabihf-cross/bin:$PATH"

        export PKG_CONFIG_PATH="/tmp/libmnl-install/lib/pkgconfig:$PKG_CONFIG_PATH"
        export CC=armv7l-linux-musleabihf-gcc
        export CFLAGS="-Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -fno-pie -I/tmp/libmnl-install/include"
        export LDFLAGS="-static -s -Wl,-no-pie -L/tmp/libmnl-install/lib"

        # ipset 6.38 official source (netfilter.org)
        wget -q https://www.netfilter.org/pub/ipset/ipset-6.38.tar.bz2 -O /tmp/ipset-6.38.tar.bz2
        tar -xjf /tmp/ipset-6.38.tar.bz2 -C /tmp/
        cd /tmp/ipset-6.38

        # musl fix: basename() needs libgen.h
        sed -i '1s/^/#include <libgen.h>\n/' src/ipset.c

        ./configure \
          --host=armv7l-linux-musleabihf \
          --prefix=/usr \
          --enable-static=yes \
          --enable-shared=no \
          --with-kmod=no

        make -j$(nproc) 2>&1 | tee /tmp/ipset-build.log

        # Static link bypassing libtool (6.38 has src/ui.c)
        cd /tmp/ipset-6.38/src
        armv7l-linux-musleabihf-gcc \
          -static -s -Wl,-no-pie \
          -o /tmp/ipset-static \
          ipset.o ui.o \
          ../lib/.libs/libipset.a \
          /tmp/libmnl-install/lib/libmnl.a \
          -lm

        file /tmp/ipset-static
        if ! file /tmp/ipset-static | grep -q "statically linked"; then
          echo "::error::ipset is NOT statically linked!"
          exit 1
        fi

    - name: Package artifacts
      if: success()
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        mkdir -p ipset-release
        cp /tmp/ipset-static ipset-release/ipset
        chmod +x ipset-release/ipset
        tar -czf ipset-armv7.tar.gz -C ipset-release .

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: E5885 Netfilter Modules ${{ github.event.inputs.version }}
        overwrite_files: true
        files: |
          netfilter-modules-armv7.tar.gz
          ipset-armv7.tar.gz
        body: |
          Netfilter + ipset modules for Huawei E5885 (kernel 3.10)

          **Kernel modules (netfilter-modules-armv7.tar.gz):**
          - `xt_TPROXY.ko`
          - `xt_socket.ko`
          - `nf_tproxy_core.ko` (if built)
          - `xt_mark.ko`
          - defrag modules (if built)
          - `nfnetlink.ko`
          - `nf_conntrack.ko`
          - `nfnetlink_queue.ko`
          - `xt_NFQUEUE.ko`
          - `xt_connbytes.ko`
          - `ip_set*.ko`
          - `xt_set.ko`

          **Userspace (ipset-armv7.tar.gz):**
          - `ipset` — STATIC ARMv7 binary

          **Install:**
          ```sh
          tar -xzf netfilter-modules-armv7.tar.gz -C /system/modules/
          insmod /system/modules/nfnetlink.ko
          insmod /system/modules/nf_conntrack.ko
          insmod /system/modules/nfnetlink_queue.ko
          insmod /system/modules/xt_NFQUEUE.ko
          insmod /system/modules/xt_connbytes.ko
          insmod /system/modules/xt_socket.ko
          insmod /system/modules/xt_TPROXY.ko
          insmod /system/modules/xt_mark.ko
          insmod /system/modules/ip_set.ko
          insmod /system/modules/xt_set.ko

          tar -xzf ipset-armv7.tar.gz -C /usr/bin/
          chmod +x /usr/bin/ipset
          ipset --version
