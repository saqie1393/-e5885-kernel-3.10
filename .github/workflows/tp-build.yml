name: Build unfuck_nfqueue for B525

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0-unfuck-nfqueue'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file patch

    - name: Extract Linaro GCC 4.7 (or use your kernel's toolchain)
      shell: bash
      run: |
        # اگر آپ کے repo میں toolchain موجود ہے تو یہاں extract کریں
        # ورنہ مناسب toolchain install کریں
        if [ -f gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 ]; then
          tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
          sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
          echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
          export PATH=/opt/gcc-4.7/bin:$PATH
        fi
        echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
        arm-linux-gnueabihf-gcc --version || echo "Toolchain not found, please check"

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Apply Device Config from /proc/config.gz
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        # اپنے repo میں موجود config.gz یا config فائل استعمال کریں
        if [ -f ../config.gz ]; then
          zcat ../config.gz > .config
        elif [ -f ../config ]; then
          cp ../config .config
        else
          echo "::error::config.gz or config not found in repo root!"
          exit 1
        fi
        # پرانی config کو نئی kernel tree کے مطابق ڈھالیں
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- oldconfig

    - name: Prepare Kernel for Module Building
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Build unfuck_nfqueue.ko
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        # فرض کریں unfuck_nfqueue کا سورس kernel tree کے اندر drivers/misc/unfuck_nfqueue میں ہے
        # آپ کو اسے اپنے repo میں اسی جگہ رکھنا ہوگا، یا M= کا راستہ تبدیل کرنا ہوگا
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ \
          M=drivers/misc/unfuck_nfqueue modules 2>&1 | tee /tmp/build.log

    - name: Verify + Strip unfuck_nfqueue.ko
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        KO="drivers/misc/unfuck_nfqueue/unfuck_nfqueue.ko"

        if [ ! -f "$KO" ]; then
          echo "::error::ERROR: unfuck_nfqueue.ko NOT built!"
          exit 1
        fi
        echo "OK: $KO built"
        ls -la "$KO"
        file "$KO"

        mkdir -p "$GITHUB_WORKSPACE/out"
        arm-linux-gnueabihf-strip --strip-unneeded "$KO"
        cp "$KO" "$GITHUB_WORKSPACE/out/"
        file "$GITHUB_WORKSPACE/out/unfuck_nfqueue.ko"
        modinfo "$GITHUB_WORKSPACE/out/unfuck_nfqueue.ko" 2>/dev/null | grep vermagic || true

        sha256sum "$GITHUB_WORKSPACE/out/unfuck_nfqueue.ko" | tee "$GITHUB_WORKSPACE/out/unfuck_nfqueue.ko.sha256"

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: unfuck_nfqueue B525 ${{ github.event.inputs.version }}
        overwrite_files: true
        files: |
          out/unfuck_nfqueue.ko
          out/unfuck_nfqueue.ko.sha256
        body: |
          `unfuck_nfqueue.ko` for Huawei B525 (kernel 3.10.100, ARMv7).

          **Install:**
          ```sh
          insmod /system/modules/unfuck_nfqueue.ko
