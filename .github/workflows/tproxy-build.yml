    - name: Inspect TPROXY config options in kernel source
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        echo "===== TPROXY related lines in net/netfilter/Kconfig ====="
        grep -n -i "tproxy" net/netfilter/Kconfig || echo "No tproxy found in Kconfig"

        echo "===== SOCKET related lines in net/netfilter/Kconfig ====="
        grep -n -i "config NETFILTER_XT_MATCH_SOCKET" net/netfilter/Kconfig || echo "No socket match found"

        echo "===== Existing TPROXY/SOCKET in defconfig ====="
        grep -n -E "TPROXY|SOCKET|DEFRAG" arch/arm/configs/hi6932_E5885Ls-93a_defconfig || echo "None found in defconfig"
