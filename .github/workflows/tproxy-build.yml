name: Build TPROXY modules for E5885

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: 'v1.0.0-tproxy'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout E5885 Kernel
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git file patch

    - name: Extract Linaro GCC 4.7
      shell: bash
      run: |
        tar -xjf gcc/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux.tar.bz2 -C /opt/
        sudo mv /opt/gcc-linaro-arm-linux-gnueabihf-4.7-2013.03-20130313_linux /opt/gcc-4.7
        echo "/opt/gcc-4.7/bin" >> "$GITHUB_PATH"
        export PATH=/opt/gcc-4.7/bin:$PATH
        arm-linux-gnueabihf-gcc --version

    - name: Detect Kernel Directory
      shell: bash
      run: |
        if [ -f Makefile ] && grep -q "mrproper" Makefile; then
          KERNEL_DIR="."
        elif [ -f kernel/Makefile ]; then
          KERNEL_DIR="kernel"
        elif [ -f kernel/e5885-kernel-3.10/Makefile ]; then
          KERNEL_DIR="kernel/e5885-kernel-3.10"
        else
          echo "Kernel Makefile not found!"; exit 1
        fi
        echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

    - name: Enable TPROXY in defconfig
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        DEFCONFIG="arch/arm/configs/hi6932_E5885Ls-93a_defconfig"

        # AHEM: CONFIG_NETFILTER_TPROXY zaroori hai, warna baqi TPROXY options drop ho jate hain
        for opt in \
          "CONFIG_NETFILTER_ADVANCED=y" \
          "CONFIG_NETFILTER_TPROXY=m" \
          "CONFIG_NETFILTER_XT_TARGET_TPROXY=m" \
          "CONFIG_NETFILTER_XT_MATCH_SOCKET=m" \
          "CONFIG_NF_DEFRAG_IPV4=y" \
          "CONFIG_NETFILTER_XT_TARGET_MARK=m" \
          "CONFIG_NETFILTER_XT_MATCH_MARK=m" \
          "CONFIG_IP_NF_MANGLE=m"
        do
          key="${opt%%=*}"
          if grep -q "^${key}=" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^${key}=.*|${opt}|" "$DEFCONFIG"
          elif grep -q "^# ${key} is not set" "$DEFCONFIG" 2>/dev/null; then
            sed -i "s|^# ${key} is not set|${opt}|" "$DEFCONFIG"
          else
            echo "$opt" >> "$DEFCONFIG"
          fi
        done

        echo "===== defconfig mein TPROXY lines ====="
        grep -E "NETFILTER_TPROXY|NETFILTER_XT_TARGET_TPROXY|NETFILTER_XT_MATCH_SOCKET" "$DEFCONFIG"

    - name: Configure Kernel (ARM)
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ hi6932_E5885Ls-93a_defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ prepare
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ modules_prepare

    - name: Verify TPROXY enabled in .config
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        echo "===== .config TPROXY lines ====="
        grep -E "NETFILTER_TPROXY|NETFILTER_XT_TARGET_TPROXY|NETFILTER_XT_MATCH_SOCKET" .config || echo "NOT FOUND in .config!"
        # Agar disabled hai to fail karo
        if ! grep -q "^CONFIG_NETFILTER_XT_TARGET_TPROXY=m" .config; then
          echo "::error::CONFIG_NETFILTER_XT_TARGET_TPROXY is NOT enabled in .config"
          exit 1
        fi

    - name: Build TPROXY modules
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        make -C . M=net/netfilter ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon LOCALVERSION=+ CC=arm-linux-gnueabihf-gcc modules 2>&1 | tee /tmp/tproxy-build.log

    - name: Strip and Verify TPROXY modules
      if: success()
      shell: bash
      run: |
        export PATH=/opt/gcc-4.7/bin:$PATH
        cd "$KERNEL_DIR"
        mkdir -p "$GITHUB_WORKSPACE/tproxy-out"

        cp net/netfilter/xt_TPROXY.ko "$GITHUB_WORKSPACE/tproxy-out/" 2>/dev/null || true
        cp net/netfilter/xt_socket.ko "$GITHUB_WORKSPACE/tproxy-out/" 2>/dev/null || true
        cp net/netfilter/xt_mark.ko "$GITHUB_WORKSPACE/tproxy-out/" 2>/dev/null || true
        cp net/netfilter/nf_tproxy_core.ko "$GITHUB_WORKSPACE/tproxy-out/" 2>/dev/null || true
        find net/ipv4/netfilter -name "*defrag*.ko" -exec cp {} "$GITHUB_WORKSPACE/tproxy-out/" \; 2>/dev/null || true

        if [ ! -f "$GITHUB_WORKSPACE/tproxy-out/xt_TPROXY.ko" ]; then
          echo "::error::xt_TPROXY.ko was NOT built!"
          exit 1
        fi

        for ko in "$GITHUB_WORKSPACE/tproxy-out/"*.ko; do
          arm-linux-gnueabihf-strip --strip-unneeded "$ko" 2>/dev/null || true
          file "$ko"
          modinfo "$ko" 2>/dev/null | grep vermagic || true
        done

        tar -czf "$GITHUB_WORKSPACE/tproxy-modules-armv7.tar.gz" -C "$GITHUB_WORKSPACE/tproxy-out" .

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: TPROXY E5885 ${{ github.event.inputs.version }}
        overwrite_files: true
        files: |
          tproxy-modules-armv7.tar.gz
        body: |
          TPROXY modules for Huawei E5885 (kernel 3.10)

          **Modules:**
          - xt_TPROXY.ko
          - xt_socket.ko
          - xt_mark.ko
          - nf_tproxy_core.ko (agar bana ho)
          - defrag module (agar alag ho)

          **Install:**
          ```sh
          insmod nf_tproxy_core.ko
          insmod xt_socket.ko
          insmod xt_TPROXY.ko
          insmod xt_mark.ko
